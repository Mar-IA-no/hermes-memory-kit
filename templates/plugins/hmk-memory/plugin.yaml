name: hmk-memory
version: 1.1.0
description: "Long-term memory provider backed by hermes-memory-kit's library.db. Per-turn RRF/hybrid prefetch recall, plus the remember/recall tools (deliberate write/read) and an on_session_end distiller that grows the library organically from conversations, tagged by interlocutor."
author: "hermes-memory-kit"
compatibility: "hermes-memory-kit >= v3.7.0; Hermes Agent >= v0.10"
